<!DOCTYPE html>
<html>
<head>
  <title>Overthink Bareng</title>
  <style>
    * {
      font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff69b4, #ff1493, #ffc0cb);
      color: white;
      font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      background: rgba(255, 192, 203, 0.4);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(255, 20, 147, 0.2);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 42px;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
      color: #fff;
      font-weight: 900;
      letter-spacing: 1px;
    }

    p {
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 30px;
      font-size: 16px;
      font-weight: 500;
      font-style: italic;
    }

    .input-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    textarea {
      width: 60%;
      height: 90px;
      border-radius: 15px;
      padding: 15px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      outline: none;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      backdrop-filter: blur(10px);
      font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
      resize: none;
    }

    textarea::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    textarea:focus {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .name-input {
      width: 25%;
      height: 90px;
      border-radius: 15px;
      padding: 15px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      outline: none;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      backdrop-filter: blur(10px);
      font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
    }

    .name-input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .name-input:focus {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
    }

    button {
      margin-top: 15px;
      padding: 12px 30px;
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.25);
      color: white;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
      font-size: 15px;
      font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }

    .post {
      background: rgba(255, 182, 193, 0.5);
      backdrop-filter: blur(10px);
      margin: 15px auto;
      padding: 20px;
      width: 90%;
      max-width: 700px;
      border-radius: 15px;
      text-align: left;
      animation: fadeIn 0.4s ease;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 15px rgba(255, 20, 147, 0.15);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    .post-author {
      font-weight: bold;
      color: rgba(255, 255, 255, 0.98);
      font-size: 15px;
      font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
    }

    .post-timestamp {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
    }

    .post-text {
      margin-bottom: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.95);
      font-size: 15px;
      font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .relate {
      margin-top: 10px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      display: inline-block;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
      font-weight: 500;
    }

    .relate:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Overthink Bareng</h1>
  <p>"Kalau kamu lagi mikir sesuatu... mungkin aku juga."</p>

  <div class="input-container">
    <input type="text" class="name-input" id="author" placeholder="Siapa nama kamu?">
    <textarea id="input" placeholder="Tulis sesuatu yang lagi kamu pikirin..."></textarea>
  </div>
  <button onclick="kirim()">Kirim Pikiran</button>

  <div id="feed"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("data")) || [];

function render() {
  let feed = document.getElementById("feed");
  feed.innerHTML = "";

  data.slice().reverse().forEach((item, i) => {
    let div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <div class="post-header">
        <div class="post-author">👤 ${item.author || 'Anonim'}</div>
        <small class="post-timestamp">${new Date(item.timestamp).toLocaleDateString('id-ID')}</small>
      </div>
      <div class="post-text">${item.text}</div>
      <div class="relate" onclick="relate(${i})">
        💭 ${item.relate} orang juga kepikiran ini
      </div>
    `;

    feed.appendChild(div);
  });
}

function kirim() {
  let input = document.getElementById("input");
  let author = document.getElementById("author");

  if (!input.value.trim()) return;

  data.push({
    text: input.value,
    author: author.value.trim() || "Anonim",
    relate: 0,
    timestamp: new Date().toISOString()
  });

  localStorage.setItem("data", JSON.stringify(data));
  input.value = "";
  author.value = "";
  render();
}

function relate(i) {
  data[i].relate++;
  localStorage.setItem("data", JSON.stringify(data));
  render();
}

render();
</script>

</body>
</html>
