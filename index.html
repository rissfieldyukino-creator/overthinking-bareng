<!DOCTYPE html>
<html>
<head>
  <title>Overthink Bareng</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-top: 40px;
      font-size: 32px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    p {
      color: rgba(255,255,255,0.9);
      margin-bottom: 30px;
    }

    .input-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    textarea {
      width: 60%;
      height: 90px;
      border-radius: 15px;
      padding: 15px;
      border: none;
      outline: none;
      font-size: 14px;
      background: rgba(255,255,255,0.15);
      color: white;
      backdrop-filter: blur(10px);
    }

    textarea::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .name-input {
      width: 25%;
      height: 90px;
      border-radius: 15px;
      padding: 15px;
      border: none;
      outline: none;
      font-size: 14px;
      background: rgba(255,255,255,0.15);
      color: white;
      backdrop-filter: blur(10px);
    }

    .name-input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    button {
      margin-top: 15px;
      padding: 10px 25px;
      border-radius: 20px;
      border: none;
      background: rgba(255,255,255,0.3);
      color: white;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    button:hover {
      background: rgba(255,255,255,0.5);
      transform: scale(1.05);
    }

    .post {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      margin: 20px auto;
      padding: 20px;
      width: 70%;
      border-radius: 15px;
      text-align: left;
      animation: fadeIn 0.4s ease;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .post-author {
      font-weight: bold;
      color: rgba(255,255,255,0.9);
      font-size: 14px;
    }

    .post-text {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .relate {
      margin-top: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      padding: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      display: inline-block;
      transition: 0.2s;
    }

    .relate:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>

<body>

<h1>Overthink Bareng</h1>
<p>"Kalau kamu lagi mikir sesuatu... mungkin aku juga."</p>

<div class="input-container">
  <input type="text" class="name-input" id="author" placeholder="Siapa nama kamu?">
  <textarea id="input" placeholder="Tulis sesuatu yang lagi kamu pikirin..."></textarea>
</div>
<button onclick="kirim()">Kirim Pikiran</button>

<div id="feed"></div>

<script>
let data = JSON.parse(localStorage.getItem("data")) || [];

function render() {
  let feed = document.getElementById("feed");
  feed.innerHTML = "";

  data.slice().reverse().forEach((item, i) => {
    let div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <div class="post-header">
        <div class="post-author">👤 ${item.author || 'Anonim'}</div>
        <small>${new Date(item.timestamp).toLocaleDateString('id-ID')}</small>
      </div>
      <div class="post-text">${item.text}</div>
      <div class="relate" onclick="relate(${i})">
        💭 ${item.relate} orang juga kepikiran ini
      </div>
    `;

    feed.appendChild(div);
  });
}

function kirim() {
  let input = document.getElementById("input");
  let author = document.getElementById("author");

  if (!input.value.trim()) return;

  data.push({
    text: input.value,
    author: author.value.trim() || "Anonim",
    relate: 0,
    timestamp: new Date().toISOString()
  });

  localStorage.setItem("data", JSON.stringify(data));
  input.value = "";
  author.value = "";
  render();
}

function relate(i) {
  data[i].relate++;
  localStorage.setItem("data", JSON.stringify(data));
  render();
}

render();
</script>

</body>
</html>
