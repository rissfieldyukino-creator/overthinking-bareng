<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overthinking Bareng — Catatan & Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(to bottom, #fdf2f8, #fce7f3);
      color: #831843;
      margin: 0;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin: 0 0 4px;
    }
    .tagline {
      text-align: center;
      color: #be185d;
      margin: 0 0 20px;
      font-size: 0.95rem;
    }
    .name-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid #fbcfe8;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .name-bar label {
      color: #be185d;
      font-size: 0.85rem;
    }
    .name-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #831843;
      font-size: 0.95rem;
      outline: none;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: #ffffff;
      border: 1px solid #fbcfe8;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      color: #be185d;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .tab.active {
      background: #ec4899;
      color: white;
    }
    .panel {
      display: none;
    }
    .panel.active {
      display: block;
    }
    textarea, input.text {
      width: 100%;
      background: #ffffff;
      border: 1px solid #fbcfe8;
      border-radius: 10px;
      padding: 12px;
      color: #831843;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
    }
    textarea:focus, input.text:focus {
      border-color: #ec4899;
    }
    textarea {
      min-height: 90px;
    }
    button {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: #ec4899;
      color: white;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.15s;
    }
    button:hover { background: #db2777; }
    button:disabled { background: #f9a8d4; cursor: not-allowed; }
    .row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .row textarea, .row input.text { flex: 1; }
    #notes-list .note {
      background: #fce7f3;
      border: 1px solid #fbcfe8;
      padding: 12px 14px;
      border-radius: 10px;
      margin: 10px 0;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #831843;
    }
    .note-meta {
      display: flex;
      justify-content: space-between;
      color: #be185d;
      font-size: 0.78rem;
      margin-bottom: 6px;
    }
    .note-name { font-weight: 600; color: #db2777; }
    #chat-box {
      background: #fff1f7;
      border: 1px solid #fbcfe8;
      border-radius: 12px;
      height: 50vh;
      overflow-y: auto;
      padding: 12px;
      margin-bottom: 10px;
    }
    .msg {
      margin: 6px 0;
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .msg .bubble {
      padding: 8px 12px;
      border-radius: 14px;
      background: #fbcfe8;
      color: #831843;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg .meta {
      font-size: 0.7rem;
      color: #be185d;
      margin-bottom: 2px;
    }
    .msg.mine { align-self: flex-end; align-items: flex-end; }
    .msg.mine .bubble { background: #ec4899; color: white; }
    .msg.theirs { align-self: flex-start; align-items: flex-start; }
    .empty {
      text-align: center;
      color: #f472b6;
      padding: 20px;
      font-style: italic;
    }
    .err {
      color: #be123c;
      font-size: 0.85rem;
      margin-top: 6px;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Overthinking Bareng</h1>
    <p class="tagline">ayo berbagi pikiran & ngobrol bareng...</p>

    <div class="name-bar">
      <label for="nama">Nama:</label>
      <input id="nama" type="text" maxlength="40" placeholder="Anonim" />
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="notes">Catatan</div>
      <div class="tab" data-tab="chat">Chat</div>
    </div>

    <div id="panel-notes" class="panel active">
      <textarea id="note-input" placeholder="Tulis pikiranmu di sini..."></textarea>
      <div class="row" style="justify-content: flex-end;">
        <button id="note-send">Kirim Catatan</button>
      </div>
      <div id="note-err" class="err"></div>
      <div id="notes-list"></div>
    </div>

    <div id="panel-chat" class="panel">
      <div id="chat-box"><div class="empty">Belum ada pesan. Mulai obrolan!</div></div>
      <div class="row">
        <input id="chat-input" class="text" placeholder="Ketik pesan..." maxlength="1000" />
        <button id="chat-send">Kirim</button>
      </div>
      <div id="chat-err" class="err"></div>
    </div>
  </div>

  <script>
    const namaInput = document.getElementById('nama');
    namaInput.value = localStorage.getItem('nama') || '';
    namaInput.addEventListener('change', () => {
      localStorage.setItem('nama', namaInput.value.trim());
    });

    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(t => t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + t.dataset.tab).classList.add('active');
      if (t.dataset.tab === 'chat') refreshChat();
      if (t.dataset.tab === 'notes') refreshNotes();
    }));

    function fmtTime(ts) {
      const d = new Date(ts);
      return d.toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
    }
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // ===== Notes =====
    const noteInput = document.getElementById('note-input');
    const noteSend = document.getElementById('note-send');
    const noteErr = document.getElementById('note-err');
    const notesList = document.getElementById('notes-list');

    async function refreshNotes() {
      try {
        const res = await fetch('/api/notes');
        const data = await res.json();
        renderNotes(data.notes || []);
      } catch (e) {
        noteErr.textContent = 'Gagal memuat catatan.';
      }
    }
    function renderNotes(notes) {
      if (!notes.length) {
        notesList.innerHTML = '<div class="empty">Belum ada catatan. Jadilah yang pertama!</div>';
        return;
      }
      notesList.innerHTML = notes.map(n => `
        <div class="note">
          <div class="note-meta">
            <span class="note-name">${escapeHtml(n.nama || 'Anonim')}</span>
            <span>${fmtTime(n.waktu)}</span>
          </div>
          ${escapeHtml(n.isi)}
        </div>
      `).join('');
    }
    noteSend.addEventListener('click', async () => {
      const isi = noteInput.value.trim();
      const nama = (namaInput.value.trim() || 'Anonim').slice(0, 40);
      noteErr.textContent = '';
      if (!isi) { noteErr.textContent = 'Catatan kosong.'; return; }
      noteSend.disabled = true;
      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isi, nama }),
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({}));
          noteErr.textContent = e.error || 'Gagal mengirim.';
        } else {
          noteInput.value = '';
          await refreshNotes();
        }
      } catch {
        noteErr.textContent = 'Gagal mengirim.';
      } finally {
        noteSend.disabled = false;
      }
    });

    // ===== Chat =====
    const chatBox = document.getElementById('chat-box');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const chatErr = document.getElementById('chat-err');
    let lastSeen = 0;
    let knownIds = new Set();
    let chatMessages = [];

    function renderChat() {
      const myName = (namaInput.value.trim() || 'Anonim');
      if (!chatMessages.length) {
        chatBox.innerHTML = '<div class="empty">Belum ada pesan. Mulai obrolan!</div>';
        return;
      }
      chatBox.innerHTML = chatMessages.map(m => {
        const mine = (m.nama || 'Anonim') === myName;
        return `
          <div class="msg ${mine ? 'mine' : 'theirs'}">
            <div class="meta">${escapeHtml(m.nama || 'Anonim')} · ${fmtTime(m.waktu)}</div>
            <div class="bubble">${escapeHtml(m.isi)}</div>
          </div>
        `;
      }).join('');
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    async function refreshChat() {
      try {
        const res = await fetch('/api/chat');
        const data = await res.json();
        chatMessages = data.messages || [];
        knownIds = new Set(chatMessages.map(m => m.id));
        if (chatMessages.length) {
          lastSeen = Math.max(...chatMessages.map(m => m.waktu));
        }
        renderChat();
      } catch {
        chatErr.textContent = 'Gagal memuat chat.';
      }
    }
    async function pollChat() {
      if (!document.getElementById('panel-chat').classList.contains('active')) return;
      try {
        const url = lastSeen ? `/api/chat?since=${lastSeen}` : '/api/chat';
        const res = await fetch(url);
        const data = await res.json();
        const newMsgs = (data.messages || []).filter(m => !knownIds.has(m.id));
        if (newMsgs.length) {
          newMsgs.forEach(m => knownIds.add(m.id));
          chatMessages = chatMessages.concat(newMsgs);
          lastSeen = Math.max(lastSeen, ...newMsgs.map(m => m.waktu));
          renderChat();
        }
      } catch { /* ignore polling errors */ }
    }
    async function sendChat() {
      const isi = chatInput.value.trim();
      const nama = (namaInput.value.trim() || 'Anonim').slice(0, 40);
      chatErr.textContent = '';
      if (!isi) return;
      chatSend.disabled = true;
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isi, nama }),
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({}));
          chatErr.textContent = e.error || 'Gagal mengirim.';
        } else {
          chatInput.value = '';
          await pollChat();
        }
      } catch {
        chatErr.textContent = 'Gagal mengirim.';
      } finally {
        chatSend.disabled = false;
        chatInput.focus();
      }
    }
    chatSend.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChat();
      }
    });

    // initial load + polling loop
    refreshNotes();
    setInterval(pollChat, 2500);
  </script>
</body>
</html>
